name: Deploy ASP.NET Core API to IIS

on:
  push:
    branches:
      - main

jobs:

  build-and-deploy:
    runs-on: self-hosted

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Restore Packages
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release

      - name: Publish
        run: dotnet publish -c Release -o C:\Publish\HrmsApi

      - name: Stop IIS
        run: iisreset /stop

      - name: Deploy Files
        run: robocopy C:\Publish\HrmsApi C:\inetpub\wwwroot\api\HrmsApi /MIR

      - name: Start IIS
        run: iisreset /start